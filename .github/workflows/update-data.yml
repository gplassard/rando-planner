# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: update-data
on:
  schedule:
    - cron: 0 4 * * 1
  workflow_dispatch: {}
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  update-data:
    name: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8
        with:
          version: 12.8.2
          runtime: node@26.10.0
          cache: true
          install: false
      - id: auto_8ece9c1e
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.10.0
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm i --frozen-lockfile
      - name: Install tippecanoe (GeoJSON -> PMTiles)
        id: install_tippecanoe_geojson_-_pmtiles
        run: sudo apt-get update && sudo apt-get install -y tippecanoe
      - name: Fetch and prepare data
        id: fetch_and_prepare_data
        run: pnpm run data
      - name: Commit and push data updates
        id: commit_and_push_data_updates
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh prepared data"
            git push
          else
            echo "No data changes"
          fi
    timeout-minutes: 30
