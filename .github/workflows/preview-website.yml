name: preview-website
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  schedule:
    - cron: 0 3 * * *
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: ${{ format('{0}-{1}', options.environmentNamePrefix, github.event.pull_request.number) }}
      url: ${{ steps.publish.outputs.url }}
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8
        with:
          version: 12.17.0
          runtime: node@26.9.0
          cache: true
          install: false
      - id: auto_b1675138
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.9.0
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm i --frozen-lockfile
      - name: Build preview
        id: build_preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |-
          PR_NUMBER=${{ github.event.pull_request.number }}
          pnpm exec tsc && pnpm exec vite build --base=/previews/pr-$PR_NUMBER/ --outDir dist-preview
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish preview
        id: publish
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            rm -rf preview-site
            if git ls-remote --exit-code --heads "$REPO_URL" previews > /dev/null 2>&1; then
              git clone --depth 1 --single-branch --branch previews "$REPO_URL" preview-site
            else
              mkdir -p preview-site
              git -C preview-site init -b previews
              git -C preview-site remote add origin "$REPO_URL"
            fi
            rm -rf "preview-site/pr-$PR_NUMBER"
            mkdir -p "preview-site/pr-$PR_NUMBER"
            cp -r dist-preview/. "preview-site/pr-$PR_NUMBER"
            date +%s > "preview-site/pr-$PR_NUMBER/.preview-updated"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/pr-$PR_NUMBER/" >> "$GITHUB_OUTPUT"
            git -C preview-site config user.name "github-actions[bot]"
            git -C preview-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C preview-site add -A
            if git -C preview-site diff --cached --quiet; then
              PUSHED=true
              break
            fi
            git -C preview-site commit -m "preview: pr-$PR_NUMBER"
            if git -C preview-site push origin previews; then
              PUSHED=true
              break
            fi
            echo "Previews branch moved concurrently, retrying (attempt $attempt)"
            sleep $((attempt * 10))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Failed to publish previews branch" >&2
            exit 1
          fi
      - name: Comment preview url
        id: comment_preview_url
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_TIME: ${{ steps.build_preview.outputs.build_time }}
        run: |-
          MARKER='<!-- preview-environment -->'
          export MARKER
          BODY=$(cat <<EOF
          Preview environment for PR #${PR_NUMBER}: ${PREVIEW_URL}

          - Commit: [${COMMIT_SHA:0:7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA})
          - Built at: ${BUILD_TIME} (UTC)

          ${MARKER}
          EOF
          )
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains($ENV.MARKER)) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
          fi
  cleanup:
    name: cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8
        with:
          version: 12.17.0
          runtime: node@26.9.0
          cache: true
          install: false
      - id: auto_b1675138
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.9.0
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm i --frozen-lockfile
      - name: Remove preview
        id: remove_preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            rm -rf preview-site
            if git ls-remote --exit-code --heads "$REPO_URL" previews > /dev/null 2>&1; then
              git clone --depth 1 --single-branch --branch previews "$REPO_URL" preview-site
            else
              mkdir -p preview-site
              git -C preview-site init -b previews
              git -C preview-site remote add origin "$REPO_URL"
            fi
            rm -rf "preview-site/pr-$PR_NUMBER"
            git -C preview-site config user.name "github-actions[bot]"
            git -C preview-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C preview-site add -A
            if git -C preview-site diff --cached --quiet; then
              exit 0
            fi
            git -C preview-site commit -m "preview: remove pr-$PR_NUMBER"
            if git -C preview-site push origin previews; then
              PUSHED=true
              break
            fi
            echo "Previews branch moved concurrently, retrying (attempt $attempt)"
            sleep $((attempt * 10))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Failed to publish previews branch" >&2
            exit 1
          fi
  prune:
    name: prune
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8
        with:
          version: 12.17.0
          runtime: node@26.9.0
          cache: true
          install: false
      - id: auto_b1675138
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.9.0
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm i --frozen-lockfile
      - name: Prune expired previews
        id: prune_expired_previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            rm -rf preview-site
            if git ls-remote --exit-code --heads "$REPO_URL" previews > /dev/null 2>&1; then
              git clone --depth 1 --single-branch --branch previews "$REPO_URL" preview-site
            else
              mkdir -p preview-site
              git -C preview-site init -b previews
              git -C preview-site remote add origin "$REPO_URL"
            fi
            NOW=$(date +%s)
            EXPIRY=604800
            for stamp in preview-site/pr-*/.preview-updated; do
              [ -f "$stamp" ] || continue
              UPDATED=$(cat "$stamp")
              if [ $((NOW - UPDATED)) -ge $EXPIRY ]; then
                echo "Pruning $(dirname "$stamp") (last updated $(date -u -d "@$UPDATED" +%Y-%m-%dT%H:%MZ))"
                rm -rf "$(dirname "$stamp")"
              fi
            done
            git -C preview-site config user.name "github-actions[bot]"
            git -C preview-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C preview-site add -A
            if git -C preview-site diff --cached --quiet; then
              exit 0
            fi
            git -C preview-site commit -m "preview: prune expired previews"
            if git -C preview-site push origin previews; then
              PUSHED=true
              break
            fi
            echo "Previews branch moved concurrently, retrying (attempt $attempt)"
            sleep $((attempt * 10))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Failed to publish previews branch" >&2
            exit 1
          fi
